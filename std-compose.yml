

services:
  # Flask App Container
  flask_app:
    build: .
    ports:
      - "5001:5001"
    depends_on:
      - mysql_db

  # MySQL Container (ယခင်တင်ပြီးသားဆိုလျှင် ၎င်း၏ setting အတိုင်း ချိန်ပေးပါ)
  mysql_db:
    image: mysql:8.1
    container_name: mysql_db
    environment:
      MYSQL_ROOT_PASSWORD: temp
      MYSQL_DATABASE: mysql_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: always

volumes:
  mysql_data:
