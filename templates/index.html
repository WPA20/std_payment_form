<!DOCTYPE html>
<html lang="my_webdb_project">
<head>
<meta charset="UTF-8">
<title>Student Payment Form</title>
<style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            padding: 50px;
        }
        .form-container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            max-width: 400px;
            margin: auto;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, select, textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            background-color: #28a745;
            color: white;
            padding: 10px;
            border: none;
            width: 100%;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #218838;
        }
	.message {
    margin: 15px 0;
    padding: 12px;
    border-radius: 5px;
    overflow-wrap: anywhere;
}

.message.success {
    background-color: #d4edda;
    color: #155724;
    border: 1px solid #c3e6cb;
}

.message.error {
    background-color: #f8d7da;
    color: #721c24;
    border: 1px solid #f5c6cb;
}
}
</style>
</head>
<body>

<div class="form-container">
<h2>BiNet Student Payment Form</h2>
{% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
        {% for category, message in messages %}
            <div class="message {{ category }}">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}
{% endwith %}
<form action="/" method="POST">
<div class="form-group">
<label for="Name">Full Name:</label>
<input type="text" id="Name" name="Name" placeholder="Enter your full name here" required>
</div>
<div class="form-group">
<label for="class">Class:</label>
<select id="class" name="Class">
<option value="CCNA">CCNA</option>
<option value="CCNP">CCNP</option>
<option value="Network Security">Network Security</option>
<option value="PCNSA">PCNSA</option>
</select>
</div>
<div class=""form-group">
<label for ="amount">Amount:</label>
<input type="number" id="amount" name="Amount" required>
</div>
<div class="form-group">
<label for="address">Address:</label>
<textarea id="address" name="Address" rows="3" required></textarea>
</div>
<div class="form-group">
<label for="payment">Payment:</label>
<select id="payment" name="Payment">
<option value="Yes">Yes</option>
<option value="No">No</option>

</select>
</div>
<div class="form-group">
    <label for="Contact">Contact:</label>
    <input
        type="tel"
        id="Contact"
        name="Contact"
        placeholder="09xxxxxxxxx"
        pattern="[0-9]+"
        inputmode="numeric"
        maxlength="15"
        title="Please enter numbers only"
        required
    >
</div>
<button type="submit">Submit</button>
</form>
</div>
 
</body>
</html>
